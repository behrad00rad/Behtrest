name: Verify V2
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/setup-node@v4
        with: {node-version: "24", cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: pip install -r backend/requirements-lock.txt
      - run: python scripts/setup_image_model.py
      - run: python scripts/setup_backend.py
      - run: python backend/manage.py check
      - run: python backend/manage.py makemigrations --check --dry-run
      - run: python backend/manage.py test accounts collection messaging
      - run: python scripts/check_recovery.py
      - run: python -m compileall -q backend scripts
      - run: npm ci
        working-directory: frontend
      - run: npm run format:check
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium webkit
        working-directory: frontend
      - run: npm run test:e2e
        env: {BEHTREST_E2E_MODERATE: "1"}
        working-directory: frontend
      - run: npx playwright test e2e/profile-mobile.spec.ts --project=safari
        env: {BEHTREST_E2E_PREVIEW: "1"}
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/prepare_container_smoke.py
      - run: python scripts/setup_image_model.py
      - run: docker compose --env-file deploy/.env -f deploy/compose.yaml config --quiet
      - run: docker compose --env-file deploy/.env -f deploy/compose.yaml build
      - run: docker compose --env-file deploy/.env -f deploy/compose.yaml run --rm backend python manage.py check --deploy --fail-level WARNING
      - run: docker compose --env-file deploy/.env -f deploy/compose.yaml run --rm backend python manage.py migrate --noinput
      - run: docker compose --env-file deploy/.env -f deploy/compose.yaml run --rm backend python manage.py collectstatic --noinput
      - run: docker compose --env-file deploy/.env -f deploy/compose.yaml up -d --wait
      - run: python scripts/container_smoke.py
      - run: docker compose --env-file deploy/.env -f deploy/compose.yaml exec -T backend python manage.py check_channel_delivery
      - run: docker compose --env-file deploy/.env -f deploy/compose.yaml stop moderation
      - run: python scripts/container_smoke.py --phase queue
      - run: docker compose --env-file deploy/.env -f deploy/compose.yaml restart backend redis web moderation
      - run: docker compose --env-file deploy/.env -f deploy/compose.yaml up -d --wait
      - run: python scripts/container_smoke.py --phase restored
      - run: docker compose --env-file deploy/.env -f deploy/compose.yaml exec -T backend python manage.py check_channel_delivery
      - run: docker compose --env-file deploy/.env -f deploy/compose.yaml logs --tail 100
        if: failure()
      - run: docker compose --env-file deploy/.env -f deploy/compose.yaml down
        if: always()
