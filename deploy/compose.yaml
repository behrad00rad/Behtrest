name: behtrest
services:
  redis:
    image: redis:7-alpine
    command: [redis-server, --save, "", --appendonly, "no", --maxmemory, 128mb, --maxmemory-policy, allkeys-lru]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 5s
      retries: 3
  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    env_file: ${BEHTREST_ENV_FILE:-.env}
    environment:
      DJANGO_SETTINGS_MODULE: config.production
      DJANGO_DEBUG: "0"
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis: {condition: service_healthy}
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    volumes:
      - data:/data
      - static:/static
      - backups:/backups
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; r=urllib.request.Request('http://localhost:8000/api/ready/',headers={'X-Forwarded-Proto':'https'}); urllib.request.urlopen(r,timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    ports:
      - "${BEHTREST_BIND_ADDRESS:-0.0.0.0}:${BEHTREST_HTTP_PORT:-80}:80"
      - "${BEHTREST_BIND_ADDRESS:-0.0.0.0}:${BEHTREST_HTTPS_PORT:-443}:443"
    volumes:
      - data:/data:ro
      - static:/static:ro
      - caddy_data:/data-caddy
      - caddy_config:/config
    environment:
      BEHTREST_DOMAIN: ${BEHTREST_DOMAIN:?Set BEHTREST_DOMAIN in deploy/.env}
      XDG_DATA_HOME: /data-caddy
    depends_on:
      backend: {condition: service_healthy}
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
  moderation:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    command: [python, manage.py, moderate_images]
    env_file: ${BEHTREST_ENV_FILE:-.env}
    environment:
      DJANGO_SETTINGS_MODULE: config.production
      REDIS_URL: redis://redis:6379/0
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    depends_on:
      backend: {condition: service_healthy}
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 1g
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    volumes:
      - data:/data
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
volumes:
  data:
  static:
  backups:
  caddy_data:
  caddy_config:
